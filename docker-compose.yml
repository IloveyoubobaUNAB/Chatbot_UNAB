services:
  mcp-server:
    build: .
    container_name: unab-mcp-server
    ports:
      - "9000:9000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    restart: always

  n8n:
    image: n8nio/n8n:latest
    container_name: unab-n8n
    ports:  
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=America/Bogota
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - mcp-server
    restart: always

volumes:
  n8n_data:
